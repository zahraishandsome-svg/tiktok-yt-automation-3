# TikTok to YouTube Channel Pairs

channels:
  - id: channel_5
    tiktok_username: "haileyallissiaa"
    youtube_channel_name: "Hailey Allissia"
    google_credentials_file: "credentials/channel_5_client_secret.json"
    oauth_token_file: "tokens/channel_5_token.json"
    videos_per_day: 2
    description_footer: ""
    default_tags:
      - haileyallissia
      - viral
      - trending
    youtube_category_id: "22"
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    upload_mode: popular_split
    # No long videos. Slot 1 = newest unposted TikTok, Slot 2 = most-VIEWED unposted
    # TikTok — both as Shorts. Switched from tiered_split 2026-07-22.
    min_backlog_for_slot1: 1
    max_download_candidates: 15
    slot_publish_times_utc:
      1: "22:00"   # PUBLIC at 6 PM ET (US)
      2: "00:00"   # PUBLIC at 8 PM ET (US)
